name: Generate Pacman Contribution Graph

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 00:00 UTC
    - cron: "0 0 * * *"
  # Permite ejecutar el workflow manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Generate Pacman Graph
        uses: SnakyDaky/pacman-contribution-graph@v1.0.0
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push Pacman Graph to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}